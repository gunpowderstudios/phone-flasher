name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Logic and pipeline tests
        run: cargo test -p flasher-core -p flasher-engine

      - name: Desktop shell compiles
        run: cargo check -p flasher

      - name: Clippy
        run: cargo clippy -p flasher-core -p flasher-engine -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Front end syntax
        run: |
          node --check src/app.js
          node --check src/mock.js
